<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/quiz.css">
</head>
<body>
    <!-- Back to Setup Button -->
    <button id="backSetup" class="btn-back-setup position-absolute d-flex align-items-center gap-2 border px-3 py-2 rounded-3">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        <span class="user-select-none">Back to Setup</span>
    </button>

    <!-- theme button -->
    <button id="theme-toggle" class="btn btn-outline-secondary theme-toggle-btn shadow-sm" aria-label="Toggle Theme">
        <i id="theme-icon" class="bi bi-moon-stars-fill fs-5"></i>
    </button>

    <!-- main container -->
    <main class="main container d-block">
        <!-- Progress Container -->
        <div class="Progress-Container container-sm mt-5">
            <!-- Progress Bar -->
            <div class="progress w-100" style="height: 1.5rem;" role="progressbar" aria-label="Animated striped example" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">
                <!-- Progress Slider -->
                <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 50%">
                    50%
                </div>
            </div>
        </div>

        <!-- Quiz Container -->
        <div class="Quiz-Container container align-items-center d-flex justify-content-center" style="height: 90vh;">
            <!-- Quiz Card -->
            <div class="card p-4 rounded-4 shadow mx-auto" style="width: 400px; height: 600px;">
                <!-- Question Section and Sidebar -->
                <div class="q-section position-relative">
                    <!-- text Question -->
                    <div class="Question text-center py-3 fs-5 fw-bold rounded-4 user-select-none">
                        Q?
                    </div>
                </div>

                <hr class=" my-4">

                <!-- Options Sections -->
                <div class="d-flex flex-column flex-grow-1 gap-3">
                    <button class="option btn btn-primary flex-fill p-3 rounded-4 fw-semibold" data-value="1">
                        <span class="fs-4 fw-semibold">option 1</span>
                    </button>

                    <button class="option btn btn-primary flex-fill p-3 rounded-4 fw-semibold" data-value="2">
                        <span class="fs-4 fw-semibold">option 2</span>
                    </button>

                    <button class="option btn btn-primary flex-fill p-3 rounded-4 fw-semibold" data-value="3">
                        <span class="fs-4 fw-semibold">option 3</span>
                    </button>

                    <button class="option btn btn-primary flex-fill p-3 rounded-4 fw-semibold" data-value="4">
                        <span class="fs-4 fw-semibold">option 4</span>
                    </button>
                </div>
            </div>

            <!-- Sidebar -->
            <div class="image-sidebar d-flex align-items-center bg-light text-dark rounded-end-3 overflow-hidden shadow">
                <div class="Img fw-bold">
                <!-- Img -->
                    <img src="" alt="Quiz Image" class="img-fluid rounded-3">
                </div>
                <button id="sidebarToggle" class="btn btn-secondary rounded-0 px-2 py-2">
                    <span>&lt;</span>
                </button>
            </div>
        </div>
    </main>

    <!-- Custom JavaScript -->
    <script type="module" src="./js/Quiz.js"></script>
</body>
</html>
